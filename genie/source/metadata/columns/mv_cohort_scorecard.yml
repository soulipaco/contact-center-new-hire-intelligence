    enable_format_assistance: true
  - column_name: best_model_type
    enable_entity_matching: true
  - column_name: best_model_r_squared
    enable_format_assistance: true
  - column_name: days_to_target
    exclude: false
  - column_name: learning_curve_interpretation
    exclude: false
