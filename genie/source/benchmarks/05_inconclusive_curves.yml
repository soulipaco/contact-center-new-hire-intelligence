question: Which selected learning curves are inconclusive?
answer_format: SQL
sql: |-
  SELECT service_program, cohort_name, kpi, model_type, r_squared
  FROM workspace.contact_center_gold.mv_learning_curve_best
  WHERE r_squared < 0.30
  ORDER BY r_squared ASC
expected_behavior: Return only the selected model for each cohort and KPI with R-squared below 0.30.
