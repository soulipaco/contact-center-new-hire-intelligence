bundle:
  name: contact-center-fictional-customer-source

sync:
  include:
    - notebooks/**

resources:
  jobs:
    create_fictional_customer_sources:
      name: ${bundle.target} - Create Fictional Customer Sources
      description: Creates privacy-safe external-shaped source tables for clean-room acceptance testing.
      tasks:
        - task_key: create_sources
          notebook_task:
            notebook_path: notebooks/00_create_source_tables.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - numpy>=1.26,<2.0
              - pandas>=2.1,<2.3
              - pyarrow>=14,<18

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
