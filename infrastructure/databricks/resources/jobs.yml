resources:
  jobs:
    bootstrap_portfolio:
      name: ${bundle.target} - Contact Center Portfolio Bootstrap
      description: End-to-end first deployment of the privacy-safe portfolio lakehouse and ML assets.
      tasks:
        - task_key: generate_bronze
          notebook_task:
            notebook_path: ../../../lakehouse/notebooks/01_generate_bronze.py
          environment_key: default
        - task_key: build_medallion
          depends_on: [{task_key: generate_bronze}]
          notebook_task:
            notebook_path: ../../../lakehouse/notebooks/02_build_medallion.sql
          environment_key: default
        - task_key: train_learning_curves
          depends_on: [{task_key: build_medallion}]
          notebook_task:
            notebook_path: ../../../lakehouse/notebooks/03_train_learning_curves.py
          environment_key: default
        - task_key: forecast_prophet
          depends_on: [{task_key: build_medallion}]
          notebook_task:
            notebook_path: ../../../lakehouse/notebooks/04_forecast_prophet.py
          environment_key: default
        - task_key: create_serving_views
          depends_on: [{task_key: train_learning_curves}, {task_key: forecast_prophet}]
          notebook_task:
            notebook_path: ../../../lakehouse/notebooks/05_create_serving_views.sql
          environment_key: default
        - task_key: acceptance_checks
          depends_on: [{task_key: create_serving_views}]
          notebook_task:
            notebook_path: ../../../lakehouse/notebooks/06_acceptance_checks.sql
          environment_key: default
      environments: &portfolio_environments
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - numpy>=1.26,<2.0
              - pandas>=2.1,<2.3
              - pyarrow>=14,<18
              - mlflow>=2.15
              - prophet>=1.1.5

    daily_lakehouse_refresh:
      name: ${bundle.target} - Daily Contact Center Lakehouse Refresh
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: generate_bronze
          notebook_task: {notebook_path: ../../../lakehouse/notebooks/01_generate_bronze.py}
          environment_key: default
        - task_key: build_medallion
          depends_on: [{task_key: generate_bronze}]
          notebook_task: {notebook_path: ../../../lakehouse/notebooks/02_build_medallion.sql}
          environment_key: default
        - task_key: create_serving_views
          depends_on: [{task_key: build_medallion}]
          notebook_task: {notebook_path: ../../../lakehouse/notebooks/05_create_serving_views.sql}
          environment_key: default
        - task_key: acceptance_checks
          depends_on: [{task_key: create_serving_views}]
          notebook_task: {notebook_path: ../../../lakehouse/notebooks/06_acceptance_checks.sql}
          environment_key: default
      environments: *portfolio_environments

    weekly_learning_curve_training:
      name: ${bundle.target} - Weekly Learning Curve Training
      schedule:
        quartz_cron_expression: "0 0 7 ? * SUN"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: train_learning_curves
          notebook_task: {notebook_path: ../../../lakehouse/notebooks/03_train_learning_curves.py}
          environment_key: default
        - task_key: refresh_serving_views
          depends_on: [{task_key: train_learning_curves}]
          notebook_task: {notebook_path: ../../../lakehouse/notebooks/05_create_serving_views.sql}
          environment_key: default
        - task_key: acceptance_checks
          depends_on: [{task_key: refresh_serving_views}]
          notebook_task: {notebook_path: ../../../lakehouse/notebooks/06_acceptance_checks.sql}
          environment_key: default
      environments: *portfolio_environments

    monthly_prophet_forecast:
      name: ${bundle.target} - Monthly Prophet Forecast
      schedule:
        quartz_cron_expression: "0 0 8 1 * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: forecast_prophet
          notebook_task: {notebook_path: ../../../lakehouse/notebooks/04_forecast_prophet.py}
          environment_key: default
        - task_key: refresh_serving_views
          depends_on: [{task_key: forecast_prophet}]
          notebook_task: {notebook_path: ../../../lakehouse/notebooks/05_create_serving_views.sql}
          environment_key: default
        - task_key: acceptance_checks
          depends_on: [{task_key: refresh_serving_views}]
          notebook_task: {notebook_path: ../../../lakehouse/notebooks/06_acceptance_checks.sql}
          environment_key: default
      environments: *portfolio_environments
