name: Bug report
description: Report a reproducible defect without including private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes: {label: Summary, description: What happened and what did you expect?}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version or commit}
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: Reproduction, description: Use fictional or redacted values only.}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Relevant logs, description: Remove tokens, IDs, names, and customer data.}

