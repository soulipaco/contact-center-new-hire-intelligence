name: Feature request
description: Propose an improvement to the accelerator.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What user or operating problem should this solve?}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior}
    validations: {required: true}
  - type: textarea
    id: contract
    attributes: {label: Data and metric impact, description: Describe grain, inputs, outputs, and compatibility.}

